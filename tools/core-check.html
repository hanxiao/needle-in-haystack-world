<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>core check</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0c0e; overflow: hidden; }
    #scene, #hud-scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #scene { z-index: 0; }
    #hud-scene { z-index: 1; }
    .panel { position: fixed; z-index: 2; border: 1px solid rgba(255,255,255,.3); pointer-events: none; }
    .panel span { position: absolute; left: 4px; top: 3px; color: #fff; font: 8px monospace; background: rgba(0,0,0,.5); padding: 1px 3px; }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <canvas id="hud-scene"></canvas>
  <div id="panels"></div>
  <script type="module" src="./core-check.js"></script>
</body>
</html>
